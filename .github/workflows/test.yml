name: Tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        emacs-version: ['29.4', '30.1', 'snapshot']
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      - name: Install dependencies
        run: |
          emacs --batch -Q \
            --eval "(require 'package)" \
            --eval "(add-to-list 'package-archives '(\"melpa\" . \"https://melpa.org/packages/\") t)" \
            --eval "(package-initialize)" \
            --eval "(package-refresh-contents)" \
            --eval "(dolist (pkg '(websocket request oauth2 circe alert dash s company)) (unless (package-installed-p pkg) (package-install pkg)))"

      - name: Byte-compile
        run: |
          emacs --batch -Q \
            --eval "(require 'package)" \
            --eval "(package-initialize)" \
            -L . \
            --eval "(setq byte-compile-error-on-warn nil)" \
            --eval "(batch-byte-compile)" *.el

      - name: Run upstream tests
        run: |
          emacs --batch -Q \
            --eval "(require 'package)" \
            --eval "(package-initialize)" \
            -L . -L test \
            -l emacs-slack \
            -l test/run-test.el

      - name: Run test suite
        run: |
          emacs --batch -Q \
            --eval "(require 'package)" \
            --eval "(package-initialize)" \
            -L . -L test \
            -l emacs-slack \
            -l test/test-suite.el \
            --eval "(ert-run-tests-batch-and-exit)"

      - name: Run buffer rendering tests
        run: |
          emacs --batch -Q \
            --eval "(require 'package)" \
            --eval "(package-initialize)" \
            -L . -L test \
            -l emacs-slack \
            -l test/test-buffer-rendering.el \
            --eval "(ert-run-tests-batch-and-exit)"
